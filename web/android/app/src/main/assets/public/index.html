<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="TimeSheet Manager - Employee Timesheet Application">
    <title>TimeSheet Manager</title>
    <!-- Font preload can be added here if needed -->
    <style>
        /* Basic loading styles */
        #root {
            width: 100%;
            height: 100vh;
            margin: 0;
            padding: 0;
        }
        
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #loader.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loader-content {
            text-align: center;
            color: white;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loader-text {
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .loader-subtext {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Main application bundle will be loaded by Next.js client -->
    
    <script>
        // Loader management
        (function() {
            const loader = document.getElementById('loader');
            
            // Wait for page resources to load
            window.addEventListener('load', function() {
                setTimeout(function() {
                    if (loader) {
                        loader.classList.add('hidden');
                        
                        // Remove loader from DOM after transition
                        setTimeout(function() {
                            if (loader && loader.parentNode) {
                                loader.parentNode.removeChild(loader);
                            }
                            
                            // Initialize application
                            initApplication();
                        }, 500);
                    } else {
                        initApplication();
                    }
                }, 1500); // Show loader for minimum 1.5 seconds
            });

            function initApplication() {
                // Application initialization will be handled by Next.js
                console.log('TimeSheet Manager - Application Initializing');
                
                // Expose any necessary globals if needed
                window.__TIMESHEET_APP__ = {
                    version: '1.0.0',
                    initialized: true
                };
            }
        })();
    </script>
</body>
</html>
